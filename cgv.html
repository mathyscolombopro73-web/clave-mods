const Nav = () => {
  const [scrolled, setScrolled] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [query, setQuery] = useState("");
  const inputRef = useRef(null);
  useEffect(() => {
    const f = () => setScrolled(window.scrollY > 4);
    window.addEventListener("scroll", f, { passive: true }); f();
    return () => window.removeEventListener("scroll", f);
  }, []);
  useEffect(() => {
    if (!searchOpen) return;
    const onKey  = (e) => { if (e.key === "Escape") { setSearchOpen(false); setQuery(""); } };
    const onDown = (e) => { if (!e.target.closest(".nav")) { setSearchOpen(false); setQuery(""); } };
    document.addEventListener("keydown", onKey);
    document.addEventListener("mousedown", onDown);
    return () => { document.removeEventListener("keydown", onKey); document.removeEventListener("mousedown", onDown); };
  }, [searchOpen]);
  useEffect(() => { if (searchOpen && inputRef.current) inputRef.current.focus(); }, [searchOpen]);
  const submit = () => {
    if (!query.trim()) return;
    window.location.href = `catalogue.html?q=${encodeURIComponent(query.trim())}`;
  };
  return (
    <nav className="nav" style={{ borderBottomColor: scrolled ? "var(--hairline-strong)" : "var(--hairline)" }}>

          <div className="nav-search">
            <input ref={inputRef} type="text" className="nav-search-input" value={query}
              onChange={(e) => setQuery(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()}
              placeholder="Rechercher une montre…" />
            <button className="nav-search-submit" onClick={submit} aria-label="Rechercher"><IArrow /></button>
          </div>
        ) : (
          <div className="nav-links">
            <a href="index.html">Accueil</a>
            <a href="index.html#collections">Collections</a>
            <a href="index.html#histoire">Notre Histoire</a>
            <a href="index.html#contact">Contact</a>
          </div>
        )}
        <div className="nav-utils">
          <button className="ic-btn" aria-label={searchOpen ? "Fermer" : "Recherche"} onClick={() => { setSearchOpen(s => !s); if (searchOpen) setQuery(""); }}><ISearch /></button>
          <button className="ic-btn ham-btn" aria-label={menuOpen ? "Fermer le menu" : "Menu"} onClick={() => setMenuOpen(o => !o)}>{menuOpen ? <IClose /> : <IMenu />}</button>
        </div>
      </div>
      {menuOpen && (
        <div className="nav-mobile">
          <a href="index.html">Accueil</a>
          <a href="index.html#collections">Collections</a>
          <a href="index.html#histoire">Notre Histoire</a>
          <a href="index.html#contact">Contact</a>

        <div className="legal-body wrap">

          <h2>1. Objet</h2>
          <p>Les présentes conditions générales de vente (CGV) régissent les relations contractuelles entre <strong>CLAVE MODS</strong> (Mathys Colombo, entrepreneur individuel, Toulouse, France) et tout acheteur non professionnel (consommateur) passant commande via le site clavemods.fr ou par tout autre canal de vente en ligne (email, réseaux sociaux).</p>

          <p>Chaque montre est assemblée et réglée à la main à l'atelier CLAVE, Toulouse. Un même modèle du catalogue peut être assemblé en plusieurs exemplaires. Les photographies sont représentatives mais peuvent présenter de légères variations de teinte selon les conditions de prise de vue.</p>

          <h2>4. Commande</h2>
          <p>La commande se fait par email, WhatsApp ou message. Avant tout paiement, CLAVE MODS vous transmet un récapitulatif (modèle, prix, frais de livraison, délai) et les présentes CGV. La commande est confirmée après :</p>

          <p>Une confirmation écrite (email) est adressée à l'acheteur.</p>

          <p>Conformément à l'article L.214-1 du Code de la consommation et à l'article 1590 du Code civil, les sommes versées à la commande sont des <strong>arrhes</strong> : si l'acheteur renonce à la commande, les arrhes restent acquises à CLAVE MODS ; si CLAVE MODS renonce à la commande, il rembourse le double des arrhes versées.</p>

          <p>Renvoyez ensuite la montre au plus tard 14 jours après nous avoir informés de votre décision. Les frais de retour sont à votre charge. Vous pouvez essayer la montre comme vous le feriez en boutique ; votre responsabilité n'est engagée qu'en cas de dépréciation résultant d'autres manipulations (par exemple : rayures, chocs, bracelet raccourci, traces d'usure).</p>

          <p>Indépendamment de la garantie commerciale, vos achats bénéficient de plein droit des garanties légales suivantes :</p>

          <p>Pour la mettre en œuvre : écrivez à <a href="mailto:clavemods@gmail.com">clavemods@gmail.com</a> avec votre numéro de commande et une description du problème. Les frais d'envoi de la montre à l'atelier et de retour sont pris en charge par CLAVE MODS.</p>
